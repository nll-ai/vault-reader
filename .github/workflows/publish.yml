name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'              # ships npm 11.5.1+ (OIDC requirement)
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false     # clean install for reproducible releases
      - run: npm ci
      - run: npm publish --provenance --access public
        # No NODE_AUTH_TOKEN: its absence triggers OIDC trusted publishing.
